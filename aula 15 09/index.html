<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Perfil</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Meu Perfil</h1>
    <img src="img/santos fc.png" alt="Foto de Perfil" id="foto" class="foto">

    <form id="formulario">
      <h2>Cadastro pessoal</h2>

      <label for="nome">Nome:</label>
      <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>

      <label for="endereco">Endereço:</label>
      <input type="text" id="endereco" name="endereco" placeholder="Digite seu endereço" readonly>

      <label for="telefone">Telefone:</label>
      <input type="tel" id="telefone" name="telefone" placeholder="11 9999-9999" required>

      <button type="submit">Enviar cadastro</button>
      <button type="button" onclick="LimparFormulario()">Limpar Formulário</button>
    </form>

    <p id="mensagem"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
